# The same application, but the whole stock is in one text file of "key: value" records.
# Run with:  java -jar target/household-appliances-warehouse.jar --config=single-file

app.name = Household Appliances Warehouse
app.version = 1.0
app.date = 2026-11-22
developer.name = Yunusbek Ismoilov
developer.contact = Yunusbek_Ismoilov@student.itpu.uz

view = com.epam.warehouse.view.ConsoleViewImpl
view.batch = com.epam.warehouse.view.BatchViewImpl
controller = com.epam.warehouse.controller.ControllerImpl
service = com.epam.warehouse.service.ApplianceServiceImpl

# Every record names its category, so one file holds them all
dao.format = com.epam.warehouse.dao.format.KeyValueFormat
dao.file = warehouse.txt
