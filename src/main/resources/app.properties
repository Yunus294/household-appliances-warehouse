# Household Appliances Warehouse: application settings.
# Another settings file can be chosen at launch:  --config=<name>  (e.g. --config=single-file)

# Shown on startup
app.name = Household Appliances Warehouse
app.version = 1.0
app.date = 2026-11-22
developer.name = Yunusbek Ismoilov
developer.contact = Yunusbek_Ismoilov@student.itpu.uz

# Implementation of each layer, created by reflection
view = com.epam.warehouse.view.ConsoleViewImpl
view.batch = com.epam.warehouse.view.BatchViewImpl
controller = com.epam.warehouse.controller.ControllerImpl
service = com.epam.warehouse.service.ApplianceServiceImpl

# Data: the file format and one file per category (looked up in resources, then on disk)
dao.format = com.epam.warehouse.dao.format.CsvFormat
dao.file.laptop = laptops.csv
dao.file.oven = ovens.csv
dao.file.refrigerator = refrigerators.csv
dao.file.washing-machine = washing-machines.csv
